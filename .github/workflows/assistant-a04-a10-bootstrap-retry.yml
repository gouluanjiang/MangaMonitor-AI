name: Repair one-time remediation runner bootstrap

on:
  push:
    branches:
      - assistant-audit-fixes-20260908
    paths:
      - .github/workflows/assistant-a04-a10-bootstrap-retry.yml

permissions:
  contents: write

jobs:
  repair-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Patch runner bootstrap only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "60f44d489c89627ce0cda8d2e51561bb11ff7ddc"
          test "$(git rev-parse --abbrev-ref HEAD)" = "assistant-audit-fixes-20260908"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/assistant-a04-a10-fix.yml')
          text = path.read_text(encoding='utf-8')
          old_guard = '          test "$(git rev-parse HEAD^)" = "5356c15f754248fe3da9aed416301563970a16cb"\n'
          new_guard = '          git merge-base --is-ancestor "5356c15f754248fe3da9aed416301563970a16cb" HEAD\n'
          if text.count(old_guard) != 1:
              raise SystemExit('unexpected audited-parent guard shape')
          text = text.replace(old_guard, new_guard)
          old_fmt = '          cargo fmt --all\n'
          new_fmt = '          rustup component add rustfmt clippy\n          cargo fmt --all\n'
          if text.count(old_fmt) != 1:
              raise SystemExit('unexpected cargo fmt shape')
          text = text.replace(old_fmt, new_fmt)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/assistant-a04-a10-bootstrap-retry.yml
          git add .github/workflows/assistant-a04-a10-fix.yml .github/workflows/assistant-a04-a10-bootstrap-retry.yml
          git diff --cached --check
          git config user.name "gouluanjiang"
          git config user.email "322563162+gouluanjiang@users.noreply.github.com"
          git commit -m "Fix one-time remediation runner bootstrap"
          test "$(git show -s --format='%ae%n%ce' HEAD | sort -u)" = "322563162+gouluanjiang@users.noreply.github.com"
          git push origin HEAD:assistant-audit-fixes-20260908
