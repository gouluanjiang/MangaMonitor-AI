name: Verified offline A04 A10 remediation v2

on:
  push:
    branches:
      - assistant-audit-fixes-20260908
    paths:
      - .github/workflows/assistant-a04-a10-run-v2.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Verify exact execution chain
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "5356c15f754248fe3da9aed416301563970a16cb" HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" = "assistant-audit-fixes-20260908"

      - name: Install pinned formatting and lint components
        run: rustup component add rustfmt clippy

      - name: Apply narrow remediation
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          python3 scripts/assistant-a04-a10-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/cloud-monitor/tests/a04_a10_final_regressions.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let mut legacy = Cursor::default();
              legacy.next_page = 2;
              legacy.boundary = "CHECKPOINT".into();
              legacy.mode = "full".into();
              legacy.observed_ids.insert("jm:one".into());
          '''
          new = '''    let mut legacy = Cursor {
              next_page: 2,
              boundary: "CHECKPOINT".into(),
              mode: "full".into(),
              ..Cursor::default()
          };
              legacy.observed_ids.insert("jm:one".into());
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected legacy cursor regression shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rustfmt --edition 2021 crates/cloud-monitor/src/monitor.rs crates/cloud-monitor/tests/a04_a10_final_regressions.rs
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(crates/cloud-monitor/src/monitor.rs|crates/cloud-monitor/tests/a04_a10_final_regressions.rs|monitor-state/inventory_index.json)$' || true)"
          if test -n "$unexpected"; then
            printf 'unexpected remediation diff:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Run focused final regressions
        run: cargo test --locked -p cloud-monitor --test a04_a10_final_regressions

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify safety defaults remain closed
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"production_enabled"[[:space:]]*:[[:space:]]*false' monitor-config.json
          grep -q '"materialization_enabled"[[:space:]]*:[[:space:]]*false' local-materialization-policy.json
          grep -q '"author_id"[[:space:]]*:[[:space:]]*"AUTHOR_0043"' formal-author-registry.json

      - name: Commit verified code only
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git add crates/cloud-monitor/src/monitor.rs \
                  crates/cloud-monitor/tests/a04_a10_final_regressions.rs \
                  monitor-state/inventory_index.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "gouluanjiang"
          git config user.email "322563162+gouluanjiang@users.noreply.github.com"
          git commit -m "Close A04 pagination and A10 bootstrap blockers"
          test "$(git show -s --format='%ae%n%ce' HEAD | sort -u)" = "322563162+gouluanjiang@users.noreply.github.com"
          git push origin HEAD:assistant-audit-fixes-20260908
