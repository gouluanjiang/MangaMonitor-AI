name: Local workbench UI

on:
  push:
    branches: [main, 'assistant-*', 'codex/**']
    paths:
      - 'apps/local-workbench/**'
      - '.github/workflows/local-workbench.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/local-workbench/**'
      - '.github/workflows/local-workbench.yml'
  workflow_dispatch:
    inputs:
      linux_runner:
        description: Ubuntu image for a separate UI migration validation
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-26.04

permissions:
  contents: read

concurrency:
  group: local-workbench-${{ github.head_ref || github.ref_name }}-${{ inputs.linux_runner || 'ubuntu-24.04' }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ${{ inputs.linux_runner == 'ubuntu-26.04' && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/local-workbench
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: '11.19.0'
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source formatting
        run: pnpm format:check
      - name: Test the demo state transitions
        run: pnpm test
      - name: Type-check and build the web app
        run: pnpm build
      - name: Upload the static preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: local-workbench-preview
          path: apps/local-workbench/dist/
          retention-days: 7
          if-no-files-found: error
      - name: Install Chromium for UI acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the mock workbench in Chromium
        run: pnpm test:ui
      - name: Check closed-tab lifetime and unchanged-catalog rendering
        run: |
          node tests/soak/tab-lifetime.mjs --rounds=12 --output=visual-evidence/tab-lifetime
          node tests/soak/source-render-cost.mjs --output=visual-evidence/source-render-cost
      - name: Upload synthetic UI visual review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: local-workbench-visual-review
          path: apps/local-workbench/visual-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload UI failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: local-workbench-ui-failure-${{ github.run_attempt }}
          path: |
            apps/local-workbench/playwright-report/
            apps/local-workbench/test-results/
          retention-days: 7
          if-no-files-found: ignore
