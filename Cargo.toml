[workspace]
members = ["crates/state-model", "crates/rules-core", "crates/jm-adapter", "crates/pica-adapter", "crates/cloud-monitor", "crates/workbench-storage", "crates/workbench-credentials", "crates/workbench-sources", "crates/workbench-accounts", "crates/workbench-library", "crates/workbench-downloads"]
exclude = ["apps/local-workbench/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
image = { version = "=0.25.5", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
state-model = { path = "crates/state-model" }
