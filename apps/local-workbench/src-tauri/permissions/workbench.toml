[[permission]]
identifier = "workbench-documents"
description = "Read and update workbench documents, or choose one background with the native picker."
commands.allow = [
  "read_preferences",
  "write_preferences",
  "read_booklists",
  "write_booklists",
  "choose_background",
]

[[permission]]
identifier = "workbench-accounts"
description = "Use native source sessions for metadata, favorites, covers and account-scoped local following."
commands.allow = [
  "source_accounts",
  "source_login",
  "source_logout",
  "source_query",
  "source_catalog",
  "source_favorite",
  "source_cover",
  "source_following",
  "source_follow",
  "discovery_read",
  "discovery_start",
  "discovery_cancel",
  "completeness_read",
  "completeness_start",
  "completeness_cancel",
  "completeness_settings_read",
  "completeness_family_confirm",
  "completeness_family_unlink",
  "completeness_language_set",
]

[[permission]]
identifier = "workbench-downloads"
description = "Prepare and explicitly confirm JM/Pica downloads into a selected PC library, control the queue and organize completed history. No renderer paths or media URLs."
commands.allow = ["jm_download_prepare", "jm_download_confirm", "jm_download_read", "jm_download_control", "jm_download_batch_prepare", "jm_download_batch_confirm", "jm_download_pause_all", "jm_download_resume_many", "jm_download_history_remove"]

[[permission]]
identifier = "workbench-library"
description = "Read the native-picked existing comic library and update its private index and explicit source associations; no media writes or execution authority."
commands.allow = ["library_read", "library_choose", "library_scan", "library_cover", "library_link", "phone_library_read", "phone_library_import", "phone_library_mark", "phone_library_unmark", "source_matches_read", "source_matches_confirm", "source_matches_unlink"]
