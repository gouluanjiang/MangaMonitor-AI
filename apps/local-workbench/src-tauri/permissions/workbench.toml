[[permission]]
identifier = "workbench-documents"
description = "Read and update workbench documents, or choose one background with the native picker."
commands.allow = [
  "read_preferences",
  "write_preferences",
  "read_booklists",
  "write_booklists",
  "choose_background",
]

[[permission]]
identifier = "workbench-accounts"
description = "Use native source sessions for metadata, favorites, covers and account-scoped local following."
commands.allow = [
  "source_accounts",
  "source_login",
  "source_logout",
  "source_query",
  "source_favorite",
  "source_cover",
  "source_following",
  "source_follow",
]
