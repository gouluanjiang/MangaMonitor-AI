[package]
name = "workbench-downloads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
workbench-storage = { path = "../workbench-storage" }
cloud-monitor = { path = "../cloud-monitor" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
workbench-library = { path = "../workbench-library" }
