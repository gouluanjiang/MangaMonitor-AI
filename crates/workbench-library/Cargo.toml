[package]
name = "workbench-library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"

[dependencies]
workbench-storage = { path = "../workbench-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
image.workspace = true
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "=0.42.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
